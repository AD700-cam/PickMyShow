services:
  # ----------------------------------------------------------------------------
  # PickMyShow Primary Web Service (Django / Gunicorn Backend)
  # ----------------------------------------------------------------------------
  - type: web
    name: pickmyshow-backend
    runtime: python
    buildCommand: bash ./build.sh
    startCommand: gunicorn PickMyShow.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --threads 2 --timeout 120
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: pickmyshow-postgres
          property: connectionString
      - key: CELERY_ALWAYS_EAGER
        value: "True"
      - key: RAZORPAY_KEY_ID
        value: rzp_test_TcNv01uLDhNUp8
      - key: RAZORPAY_KEY_SECRET
        value: 2Or4TJ6CYl0lUpC2oSWtVFnV
      - key: RAZORPAY_WEBHOOK_SECRET
        value: pms_webhook_secret_free_67890
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: pickmyshow0@gmail.com
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "PickMyShow <pickmyshow0@gmail.com>"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_PASSWORD
        value: admin123
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com

databases:
  # ----------------------------------------------------------------------------
  # Managed PostgreSQL Database for Persistent Relational Storage
  # ----------------------------------------------------------------------------
  - name: pickmyshow-postgres
    databaseName: pickmyshow
    user: pickmyshow_user
    plan: free
